name: CI and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            exe: OlympiadRecorder
            qt_dependencies: "'PyQt6~=6.8.0' 'PyQt6-Qt6~=6.8.0'"
          - runner: windows-11-arm
            arch: arm64
            exe: OlympiadRecorder-arm64
            qt_dependencies: PyQt6
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: python -m pip install ${{ matrix.qt_dependencies }} soundcard sounddevice soundfile numpy lameenc keyboard pyinstaller pytest

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Build
        # UPX-packed exes get flagged by antivirus scanners far more often (#10)
        run: python -m PyInstaller --noconsole --onefile --noupx --name ${{ matrix.exe }} main.py

      - name: Checksum
        run: |
          $exe = "${{ matrix.exe }}.exe"
          $hash = (Get-FileHash -LiteralPath "dist/$exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $exe`n" | Out-File -Encoding ascii -NoNewline "dist/$exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.exe }}
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}.exe.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  draft-release:
    name: Prepare release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: OlympiadRecorder*
          path: dist
          merge-multiple: true

      - name: Attach both Windows builds to the draft
        working-directory: dist
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            OlympiadRecorder.exe OlympiadRecorder.exe.sha256
            OlympiadRecorder-arm64.exe OlympiadRecorder-arm64.exe.sha256
          )
          sha256sum --check OlympiadRecorder.exe.sha256 OlympiadRecorder-arm64.exe.sha256
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
              --title "Olympiad Recorder $RELEASE_TAG" --generate-notes
          fi
